interface:
  display_name: XBrief
  short_description: Read-only X analysis; archive only on explicit request.
  default_prompt: "Use $xbrief: match analysis depth to my request; save only on explicit request."

compatibility:
  canonical_format: agent-skills
  adapter_targets:
    - openai
    - generic
  activation:
    mode: manual
    paths: []
  execution:
    context: inline
    shell: bash
  trust:
    source_tier: local
    remote_inline_execution: forbid
    remote_metadata_policy: allow-metadata-only
  degradation:
    openai: Preserve existing captures; report unavailable dependencies without switching modes or inventing evidence.
    generic: READ requires the Codex built-in browser; ARCHIVE uses the local CLI only with explicit save intent. Report unavailable dependencies.
